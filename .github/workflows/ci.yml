# Name shown in GitHub UI
name: Python CI (Parallel)

# Events that trigger this workflow
on:
  push:
    branches: [ "main" ] # On push to main
  pull_request:
    branches: [ "main" ] # On PR targeting main
  workflow_dispatch: # Allows manual triggering

# Jobs to run
jobs:
  lint: # Job ID for Linting
    name: Run Linter # Display name for the job
    runs-on: ubuntu-latest # Runner environment

    steps: # Sequence of tasks for the lint job
      # 1. Get the code
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Install Linter dependency
      - name: Install Flake8
        run: |
          pip install --upgrade pip
          pip install flake8

      # 4. Run Linter
      - name: Lint with Flake8
        run: flake8 . --count --statistics

  




test: # Job ID for Testing
    name: Run Tests # Display name for the job
    runs-on: ubuntu-latest # Runner environment

    steps: # Sequence of tasks for the test job
      # 1. Get the code
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Install Testing dependency
      - name: Install Pytest
        run: |
          pip install --upgrade pip
          pip install pytest

      # 4. Run Tests
      - name: Test with Pytest
        run: pytest

